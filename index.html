<meta charset="utf-8">
<title>Kingpin USA-Free Browser Game</title>
<meta name="description" content="Play Kingpin USA, an exciting action game where you steal cars and take over districts directly in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed top-down canvas, HUD pinned to the edges, thumbs control the bottom corners */
:root{--bg:#101218;--ink:#f3efe6;--dim:#9aa0ad;--asph:#23262e;--hot:#ff4d2e;--gold:#ffc23c;--ok:#3ddc97;--glass:rgba(16,18,24,.66);--fd:'Bungee',Impact,sans-serif;--fb:'Barlow Condensed','Arial Narrow',sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:relative;width:100%;height:100%;background:var(--bg)}
canvas#c{position:absolute;inset:0;display:block}
#hud{position:absolute;inset:0;pointer-events:none;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cash{font-family:var(--fd);font-size:26px;color:var(--ok);text-shadow:0 2px 0 #000}
.inc{font-size:13px;white-space:nowrap;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.top>div:first-child{min-width:0;flex:1}
.stars{white-space:nowrap;position:absolute;left:0;right:0;top:calc(10px + 118px);pointer-events:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;color:#4a4f5c;text-shadow:0 2px 0 #000;text-align:center}
.stars b{color:var(--gold);font-weight:400;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hp{width:120px;height:12px;background:#000;border:2px solid #000;border-radius:2px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--hot);transition:width .15s}
#mm{width:104px;height:104px;background:var(--glass);border:2px solid #000;border-radius:3px}
.zone{margin-top:6px;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 0 #000}
.zone small{display:block;font-size:14px;color:var(--dim);font-weight:500}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--fd);font-size:22px;text-align:center;text-shadow:0 3px 0 #000;opacity:0;transition:opacity .25s;white-space:nowrap;color:var(--gold)}
#toast.on{opacity:1}
.pad{position:absolute;left:0;right:0;bottom:0;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#joy{width:130px;height:130px;border-radius:50%;background:var(--glass);border:2px solid rgba(255,255,255,.18);position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(243,239,230,.85);box-shadow:0 3px 0 #000}
.btns{display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;pointer-events:auto}
.b{font-family:var(--fd);color:var(--ink);background:var(--glass);border:2px solid rgba(255,255,255,.22);border-radius:50%;width:64px;height:64px;font-size:11px;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:0}
.b:active,.b.down{background:var(--hot);border-color:#fff}
.b.fire{width:92px;height:92px;font-size:15px;grid-column:2;background:rgba(255,77,46,.55)}
.b.act{grid-column:1}
#ov,#ov2{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(16,18,24,.82),rgba(8,9,12,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
#ov[hidden],#ov2[hidden]{display:none}
#ov2{background:rgba(8,9,12,.78)}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(40px,12vw,76px);margin:0;line-height:.9;color:var(--hot);text-shadow:0 4px 0 #000;text-wrap:balance}
h1 span{display:block;color:var(--ink);font-size:.5em;letter-spacing:.12em}
#ov p,#ov2 p{margin:0;max-width:34ch;color:var(--dim);font-size:18px;text-wrap:balance}
.states{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.s{font-family:var(--fd);font-size:15px;color:var(--ink);background:#1b1e26;border:2px solid #3a3f4d;border-radius:4px;padding:12px 16px;cursor:pointer;pointer-events:auto}
.s small{display:block;font-family:var(--fb);font-weight:500;font-size:14px;color:var(--dim);margin-top:2px}
.s:hover,.s:focus-visible{border-color:var(--gold);outline:none}
.s.sel{border-color:var(--hot);background:#2a1d1c}
.go{font-family:var(--fd);font-size:20px;color:#000;background:var(--gold);border:0;border-radius:4px;padding:14px 34px;box-shadow:0 5px 0 #8a6511;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6511}
.how{font-size:15px!important;color:#6f7585!important}

<div id="stage">
<canvas id="c"></canvas>

  <div class="top">

<script>
'use strict';
// ---------- utils ----------
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const $ = id => document.getElementById(id);

// ---------- canvas ----------
const cv = $('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = cv.parentElement.clientWidth; VH = cv.parentElement.clientHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
}
addEventListener('resize', resize); resize();

// ---------- states ----------
const STATES = {
  CA: { name: 'California', city: 'Los Angeles', ground: '#2b2a2e', side: '#4a4743', park: '#2f5a3a',
        zones: ['Venice', 'Downtown', 'Hollywood', 'Compton', 'Echo Park', 'Koreatown', 'Harbor', 'Silver Lake', 'Boyle Heights'] },
  TX: { name: 'Texas', city: 'Houston', ground: '#2d2a28', side: '#554b40', park: '#4a5a34',
        zones: ['Downtown', 'Third Ward', 'Montrose', 'Heights', 'Galleria', 'East End', 'Midtown', 'Sunnyside', 'Ship Channel'] },
  NY: { name: 'New York', city: 'New York City', ground: '#25272d', side: '#454a54', park: '#2c5238',
        zones: ['Harlem', 'Bronx', 'Brooklyn', 'Queens', 'Chinatown', 'SoHo', 'Hell’s Kitchen', 'Bushwick', 'Red Hook'] }
};

// ---------- audio ----------
let AC = null, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, lp) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  pistol() { noise(0.12, 0.35, 3500); tone(260, 60, 0.1, 'square', 0.12); },
  smg() { noise(0.07, 0.28, 4500); tone(300, 90, 0.06, 'square', 0.08); },
  shotgun() { noise(0.3, 0.6, 2200); tone(150, 40, 0.25, 'sawtooth', 0.2); },
  hit() { noise(0.06, 0.25, 1500); tone(180, 70, 0.08, 'triangle', 0.18); },
  boom() { noise(0.7, 0.7, 900); tone(90, 25, 0.6, 'sawtooth', 0.3); },
  cash() { tone(880, 1320, 0.12, 'square', 0.07); setTimeout(() => tone(1320, 1760, 0.12, 'square', 0.07), 70); },
  horn() { tone(330, 320, 0.25, 'sawtooth', 0.08); },
  thud() { noise(0.1, 0.3, 500); tone(100, 40, 0.1, 'sine', 0.3); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.18, 'square', 0.09), i * 110)); },
  siren() { tone(700, 900, 0.3, 'sine', 0.04); }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------- input ----------
const inp = { mx: 0, my: 0, fire: false, act: false, wpn: false };
const keys = {};
(function () {
  const joy = $('joy'), knob = $('knob'); let pid = null;
  function move(e) {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const m = Math.hypot(dx, dy), R = r.width / 2;
    if (m > R) { dx = dx / m * R; dy = dy / m * R; }
    inp.mx = dx / R; inp.my = dy / R;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  }
  joy.addEventListener('pointerdown', e => { pid = e.pointerId; joy.setPointerCapture(pid); audioInit(); move(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  const end = e => { if (e.pointerId === pid) { pid = null; inp.mx = inp.my = 0; knob.style.transform = ''; } };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  function hold(id, key) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); inp[key] = true; b.classList.add('down'); });
    const up = () => { if (key === 'fire') inp[key] = false; b.classList.remove('down'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  }
  hold('bFire', 'fire'); hold('bAct', 'act'); hold('bWpn', 'wpn');
  addEventListener('keydown', e => {
    keys[e.code] = true; audioInit();
    if (e.code === 'KeyE') inp.act = true;
    if (e.code === 'KeyQ') inp.wpn = true;
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('contextmenu', e => e.preventDefault());
})();
function readStick() {
  let x = inp.mx, y = inp.my;
  if (keys.KeyA || keys.ArrowLeft) x -= 1; if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) y -= 1; if (keys.KeyS || keys.ArrowDown) y += 1;
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  return { x, y, m: Math.min(1, m) };
}
const wantFire = () => inp.fire || keys.Space;

// ---------- world ----------
const BLK = 240, ROAD = 100, PITCH = BLK + ROAD, N = 9, SIZE = N * PITCH + ROAD;
const roadC = k => ROAD / 2 + k * PITCH;
let ST = STATES.CA, blocks = [], districts = [];
const PALETTE = ['#6b7280', '#7b6f64', '#5f6b7a', '#8a7f70', '#6d5f63', '#58606b', '#847a6b'];

function buildWorld(key) {
  ST = STATES[key]; blocks = []; districts = [];
  for (let i = 0; i < N; i++) {
    blocks[i] = [];
    for (let j = 0; j < N; j++) {
      const bx = ROAD + i * PITCH, by = ROAD + j * PITCH, list = [], pad = 14, gap = 10;
      const lw = (BLK - pad * 2 - gap) / 2;
      for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
        const x = bx + pad + a * (lw + gap), y = by + pad + b * (lw + gap);
        if (Math.random() < 0.18) list.push({ x, y, w: lw, h: lw, park: true });
        else {
          const sh = rnd(0.7, 1.15), c = pick(PALETTE);
          list.push({ x, y, w: lw, h: lw, col: c, hgt: rint(6, 22), sh, ac: Math.random() < 0.5 });
        }
      }
      blocks[i][j] = { x: bx, y: by, list };
    }
  }
  for (let d = 0; d < 9; d++) {
    const di = d % 3, dj = Math.floor(d / 3);
    districts.push({ id: d, name: ST.zones[d], x0: di * 3 * PITCH, y0: dj * 3 * PITCH, x1: (di + 1) * 3 * PITCH + (di === 2 ? ROAD : 0), y1: (dj + 1) * 3 * PITCH + (dj === 2 ? ROAD : 0),
      owner: 0, need: 5 + Math.floor(d / 3) * 2 + (d % 3), kills: 0, cx: (di * 3 + 1.5) * PITCH + ROAD / 2, cy: (dj * 3 + 1.5) * PITCH + ROAD / 2 });
  }
}
function districtAt(x, y) {
  const di = clamp(Math.floor(x / (3 * PITCH)), 0, 2), dj = clamp(Math.floor(y / (3 * PITCH)), 0, 2);
  return districts[dj * 3 + di];
}
// circle vs solid buildings; returns {nx,ny,pen} or null
function solidAt(x, y, r) {
  const bi = Math.floor((x - ROAD) / PITCH), bj = Math.floor((y - ROAD) / PITCH);
  for (let i = bi - 1; i <= bi + 1; i++) for (let j = bj - 1; j <= bj + 1; j++) {
    if (i < 0 || j < 0 || i >= N || j >= N) continue;
    for (const b of blocks[i][j].list) {
      if (b.park) continue;
      const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
      const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
      if (d2 < r * r) {
        if (d2 < 0.0001) return { nx: 0, ny: -1, pen: r };
        const d = Math.sqrt(d2); return { nx: dx / d, ny: dy / d, pen: r - d };
      }
    }
  }
  return null;
}
function inMap(x, y, r) { return x > r && y > r && x < SIZE - r && y < SIZE - r; }
function lineBlocked(x0, y0, x1, y1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 24);
  for (let k = 1; k < n; k++) { const t = k / n; if (solidAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, 2)) return true; }
  return false;
}

</script>
<script>
'use strict';
// ---------- game state ----------
const WPN = [
  { n: 'PISTOL', dmg: 22, rate: 0.28, spd: 900, spread: 0.03, pel: 1, snd: 'pistol', kick: 1.2, rng: 520 },
  { n: 'SMG', dmg: 11, rate: 0.085, spd: 1000, spread: 0.09, pel: 1, snd: 'smg', kick: 0.6, rng: 480 },
  { n: 'SHOTGUN', dmg: 13, rate: 0.8, spd: 850, spread: 0.24, pel: 6, snd: 'shotgun', kick: 3, rng: 320 }
];
const CAR_COLS = ['#c8322b', '#2f6fb5', '#e0b83a', '#e8e4da', '#2f9e6a', '#7a4fa3', '#d9772b', '#3b3f48'];
let G, P;

function newGame(key) {
  buildWorld(key);
  G = { key, cash: 500, heat: 0, wanted: 0, hitstop: 0, shake: 0, kx: 0, ky: 0, t: 0, over: false, won: false, nitro: 1,
        enemies: [], cops: [], peds: [], cars: [], bullets: [], parts: [], texts: [], decals: [],
        camX: 0, camY: 0, raidT: 50, sirenT: 0, incomeT: 0, toastT: 0 };
  P = { x: roadC(1), y: roadC(1) + 30, a: 0, hp: 100, maxhp: 100, r: 9, flash: 0, vx: 0, vy: 0, cool: 0, mf: 0, wi: 0, car: null, step: 0 };
  G.camX = P.x; G.camY = P.y;
  for (let i = 0; i < 16; i++) spawnCar(true);
  for (let i = 0; i < 26; i++) spawnPed(true);
  updateWeaponBtn();
}
const ownedCount = () => districts.filter(d => d.owner).length;
const maxWeapon = () => ownedCount() >= 3 ? 2 : ownedCount() >= 1 ? 1 : 0;
function updateWeaponBtn() { $('bWpn').textContent = WPN[P.wi].n; }
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); G.toastT = 2.2; }
function addHeat(n) { G.heat = clamp(G.heat + n, 0, 500); }
function addCash(n, x, y) { G.cash += n; if (x !== undefined) addText(x, y, '+$' + n, '#3ddc97'); sfx.cash(); }

// ---------- fx ----------
function part(x, y, vx, vy, life, col, size, grav) { if (G.parts.length < 420) G.parts.push({ x, y, vx, vy, life, max: life, col, size, grav: grav || 0 }); }
function addText(x, y, s, col, big) { G.texts.push({ x, y, s, col, life: 0.9, big }); }
function blood(x, y, ang, n) {
  for (let i = 0; i < n; i++) { const a = ang + rnd(-0.7, 0.7), s = rnd(60, 220); part(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.25, 0.55), '#b3141b', rnd(1.5, 3.2)); }
}
function spark(x, y, n) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(60, 240); part(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.1, 0.3), '#ffd36a', 1.8); } }
function decal(x, y, col, r) { G.decals.push({ x, y, col, r }); if (G.decals.length > 140) G.decals.shift(); }

// ---------- spawning ----------
function freeSpot(minD, maxD, onRoad) {
  for (let k = 0; k < 20; k++) {
    const a = rnd(0, TAU), d = rnd(minD, maxD), x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
    if (!inMap(x, y, 30) || solidAt(x, y, 14)) continue;
    return { x, y };
  }
  return null;
}
function spawnPed(anywhere) {
  const s = freeSpot(anywhere ? 60 : 500, anywhere ? 900 : 800); if (!s) return;
  G.peds.push({ x: s.x, y: s.y, a: rnd(0, TAU), hp: 20, r: 8, flash: 0, vx: 0, vy: 0, scared: 0, col: pick(['#d9a066', '#8d5524', '#f1c27d', '#c68642', '#e0ac69']), shirt: pick(['#e85d75', '#4ea8de', '#f4d35e', '#7bc67b', '#b388eb', '#eeeeee']), turn: rnd(1, 4) });
}
function spawnCar(anywhere) {
  for (let k = 0; k < 12; k++) {
    const horiz = Math.random() < 0.5, rk = rint(0, N), pos = rnd(100, SIZE - 100);
    const dir = Math.random() < 0.5 ? 1 : -1, c = { dx: horiz ? dir : 0, dy: horiz ? 0 : dir, laneC: roadC(rk) };
    c.x = horiz ? pos : c.laneC; c.y = horiz ? c.laneC : pos;
    const o = horiz ? c.dx * 17 : 0, o2 = horiz ? 0 : -c.dy * 17; c.x += o2; c.y += o;
    const dd = Math.hypot(c.x - P.x, c.y - P.y);
    if (anywhere ? dd < 90 : (dd < 520 || dd > 1000)) continue;
    if (G.cars.some(q => Math.hypot(q.x - c.x, q.y - c.y) < 70)) continue;
    c.a = Math.atan2(c.dy, c.dx); c.sp = 0; c.hp = 100; c.col = pick(CAR_COLS); c.mode = 'traffic'; c.flash = 0; c.cd = 0; c.vx = 0; c.vy = 0; c.r = 16;
    G.cars.push(c); return;
  }
}
function spawnEnemy(d, raid) {
  const s = raid ? (() => { for (let k = 0; k < 20; k++) { const x = d.cx + rnd(-300, 300), y = d.cy + rnd(-300, 300); if (!solidAt(x, y, 14)) return { x, y }; } return null; })() : freeSpot(380, 650);
  if (!s) return false;
  const dd = districtAt(s.x, s.y); if (!raid && dd.owner) return false;

function spawnCop() {

  G.cops.push({ x: s.x, y: s.y, a: 0, hp: 55, maxhp: 55, r: 9, flash: 0, vx: 0, vy: 0, cool: rnd(0.6, 1.4), strafe: Math.random() < 0.5 ? 1 : -1, st: rnd(0, 3) });

// ---------- movement ----------
function moveFoot(e, dx, dy) {
  let nx = e.x + dx; if (inMap(nx, e.y, e.r) && !solidAt(nx, e.y, e.r)) e.x = nx;
  let ny = e.y + dy; if (inMap(e.x, ny, e.r) && !solidAt(e.x, ny, e.r)) e.y = ny;
}
function applyKnock(e, dt) {
  if (Math.abs(e.vx) + Math.abs(e.vy) > 1) { moveFoot(e, e.vx * dt, e.vy * dt); e.vx *= Math.pow(0.0006, dt); e.vy *= Math.pow(0.0006, dt); }
}

function explode(c) {

  for (let i = 0; i < 40; i++) { const a = rnd(0, TAU), s = rnd(40, 320); part(c.x, c.y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.3, 0.9), pick(['#ff8a1f', '#ffd36a', '#444', '#ff4d2e']), rnd(2, 6)); }

// ---------- combat ----------
function nearestFoe(range) {

}
function fireBullet(x, y, a, w, own, dmg) {

// ---------- AI ----------
function footAI(e, dt, cop) {

    if (e.cool <= 0 && d < 430) { enemyShoot(e, cop ? 'c' : 'e', T.x, T.y); e.cool = cop ? rnd(0.7, 1.2) : rnd(0.8, 1.6); }

  } else if (e.st < 0) { e.a += rnd(-1.5, 1.5); e.st = rnd(1, 3); }

}
function pedAI(p, dt) {

  if (p.scared > 0) { const a = Math.atan2(p.y - P.y, p.x - P.x); p.a = a; moveFoot(p, Math.cos(a) * 125 * dt, Math.sin(a) * 125 * dt); }

  if (!P.car && Math.hypot(P.x - fx, P.y - fy) < 30) go = 0;
  if (P.car && P.car !== c && Math.hypot(P.car.x - fx, P.car.y - fy) < 36) go = 0;

<script>
'use strict';
let running = false, selKey = 'CA', lastT = 0, zoom = 1, bgT = 0;

// ---------- menu ----------
(function () {
  const box = $('states');
  Object.keys(STATES).forEach(k => {
    const b = document.createElement('button'); b.className = 's' + (k === selKey ? ' sel' : '');
    b.innerHTML = STATES[k].name + '<small>' + STATES[k].city + '</small>';
    b.onclick = () => { selKey = k; box.querySelectorAll('.s').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); newGame(k); };
    box.appendChild(b);
  });
  $('go').onclick = () => { audioInit(); newGame(selKey); $('ov').hidden = true; running = true; toast('TAKE OVER ' + ST.city.toUpperCase()); };
  $('again').onclick = () => {
    $('ov2').hidden = true; G.over = false; G.won = false; P.hp = P.maxhp; if (P.car) P.car.mode = 'parked'; P.car = null; P.x = roadC(1); P.y = roadC(1) + 30; P.vx = P.vy = 0;
    G.heat = 0; G.cops.length = 0; G.bullets.length = 0; G.enemies = G.enemies.filter(e => e.raid);
  };
})();
function showWasted() { $('t2').textContent = 'WASTED'; $('p2').innerHTML = 'The hospital kept <b>' + G.lostTxt + '</b> of your cash.'; $('again').textContent = 'RESPAWN'; $('ov2').hidden = false; }
function showWin() { $('t2').textContent = 'STATE TAKEN'; $('p2').innerHTML = 'Every district in ' + ST.name + ' belongs to you. Keep playing or pick another state.'; $('again').textContent = 'KEEP PLAYING'; $('ov2').hidden = false; G.over = false; }

// ---------- cars ----------
function toggleCar() {

    const c = P.car; c.mode = 'parked'; P.car = null;
    for (const s of [1, -1]) { const x = c.x + Math.cos(c.a + 1.57) * 28 * s, y = c.y + Math.sin(c.a + 1.57) * 28 * s; if (!solidAt(x, y, 10)) { P.x = x; P.y = y; return; } }
    P.x = c.x; P.y = c.y;
  } else {

    if (!best) return;
    if (best.mode === 'traffic') {
      addHeat(55); toast('CARJACKED'); sfx.horn();
      G.peds.push({ x: best.x + Math.cos(best.a + 1.57) * 26, y: best.y + Math.sin(best.a + 1.57) * 26, a: 0, hp: 20, r: 8, flash: 0, vx: 0, vy: 0, scared: 7, col: '#c68642', shirt: '#eeeeee', turn: 2 });

}
function driveCar(dt, s) {

function moveCar(c, dt) {

      c.sp *= -0.3; break;

}

// ---------- main update ----------
function update(dtReal) {

    G.enemies = G.enemies.filter(e => e.raid || dist(e, P) < 1150);
    if (G.cars.filter(c => c.mode === 'traffic').length < 18) spawnCar(false);
    if (G.peds.length < 26) spawnPed(false);
    G.cars = G.cars.filter(c => c === P.car || (c.mode === 'wreck' ? c.life > 0 : dist(c, P) < 1500));

  if (G.raidT <= 0 && !G.over) {
    const opts = districts.filter(d => d.owner && !d.raid && districtAt(P.x, P.y) !== d);
    if (opts.length) { const d = pick(opts); d.raid = true; d.raidT = 45; for (let i = 0; i < 4; i++) spawnEnemy(d, true); toast('RIVALS HIT ' + d.name.toUpperCase()); }
